<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google検索</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#333}
.container{max-width:700px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:24px}
.description{color:#666;font-size:14px;margin-bottom:15px}
textarea{width:100%;min-height:220px;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px;line-height:1.6;resize:vertical}
textarea:focus{outline:none;border-color:#4285f4}
.count{margin-top:10px;font-size:14px;color:#666}
.search-list{margin-top:20px}
.search-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.keyword{flex:1;font-size:15px;word-break:break-word}
.search-button{flex-shrink:0;padding:9px 16px;border:0;border-radius:8px;background:#4285f4;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}
.search-button:active{transform:scale(.97)}
.clear-button{width:100%;margin-top:15px;padding:12px;border:0;border-radius:10px;background:#eee;color:#333;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<div class="container">
<h1>🔎 Google検索</h1>

<div class="description">
検索したいワードを1行ずつ入力してください。
</div>

<textarea id="keywords" placeholder="沖縄 プール ホテル
北海道 子連れ ホテル
東北 プール ホテル
北陸 プール ホテル"></textarea>

<div class="count">
検索ワード：<span id="count">0</span>件
</div>

<div id="searchList" class="search-list"></div>

<button id="clearButton" class="clear-button">クリア</button>
</div>

<script>
const textarea=document.getElementById("keywords");
const count=document.getElementById("count");
const searchList=document.getElementById("searchList");
const clearButton=document.getElementById("clearButton");

function getKeywords(){
  return textarea.value
    .split(/\r?\n/)
    .map(word=>word.trim())
    .filter(word=>word!=="");
}

function updateSearchList(){
  const keywords=getKeywords();
  count.textContent=keywords.length;
  searchList.innerHTML="";

  keywords.forEach(keyword=>{
    const item=document.createElement("div");
    item.className="search-item";

    const text=document.createElement("div");
    text.className="keyword";
    text.textContent=keyword;

    const button=document.createElement("button");
    button.className="search-button";
    button.textContent="検索";

    button.addEventListener("click",()=>{
      const url="https://www.google.com/search?q="+encodeURIComponent(keyword);
      window.open(url,"_blank");
    });

    item.appendChild(text);
    item.appendChild(button);
    searchList.appendChild(item);
  });
}

textarea.addEventListener("input",updateSearchList);

clearButton.addEventListener("click",()=>{
  textarea.value="";
  count.textContent="0";
  searchList.innerHTML="";
  textarea.focus();
});

updateSearchList();
</script>

</body>
</html>
