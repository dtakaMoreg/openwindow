<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google検索 一括オープン</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Hiragino Sans",
                   Meiryo, sans-serif;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .description {
      color: #666;
      font-size: 14px;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #4285f4;
      box-shadow: 0 0 0 3px rgba(66,133,244,0.12);
    }

    .count {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton {
      flex: 1;
      background: #4285f4;
      color: white;
    }

    #searchButton:hover {
      background: #3367d6;
    }

    #clearButton {
      background: #eee;
      color: #333;
    }

    #message {
      margin-top: 14px;
      font-size: 14px;
      color: #666;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
      }

      h1 {
        font-size: 20px;
      }

      textarea {
        min-height: 250px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔎 Google検索 一括オープン</h1>

  <div class="description">
    検索したいワードを1行ずつ入力してください。
  </div>

  <textarea id="keywords" placeholder="沖縄 プール ホテル
北海道 子連れ ホテル
関東 プール付きホテル
東海 子ども ホテル"></textarea>

  <div class="count">
    検索ワード：<span id="count">0</span>件
  </div>

  <div class="buttons">
    <button id="searchButton">🔎 Google検索を開く</button>
    <button id="clearButton">クリア</button>
  </div>

  <div id="message"></div>

</div>

<script>

  const textarea = document.getElementById("keywords");
  const count = document.getElementById("count");
  const message = document.getElementById("message");

  // 件数を更新
  function updateCount() {
    const keywords = getKeywords();
    count.textContent = keywords.length;
  }

  // 検索ワード取得
  function getKeywords() {
    return textarea.value
      .split(/\r?\n/)
      .map(word => word.trim())
      .filter(word => word !== "");
  }

  // 入力時に件数更新
  textarea.addEventListener("input", updateCount);

  // Google検索
  document.getElementById("searchButton").addEventListener("click", () => {

    const keywords = getKeywords();

    if (keywords.length === 0) {
      message.textContent = "検索ワードを入力してください。";
      return;
    }

    message.textContent = `${keywords.length}件の検索ページを開きます。`;

    keywords.forEach((keyword, index) => {

      const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(keyword);

      window.open(url, "_blank");

    });

  });

  // クリア
  document.getElementById("clearButton").addEventListener("click", () => {

    textarea.value = "";
    updateCount();
    message.textContent = "";

    textarea.focus();

  });

  updateCount();

</script>

</body>
</html>
