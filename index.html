<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google検索</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    color:#333;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:24px;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
    margin:0 0 8px;
    font-size:24px;
}

.description{
    color:#666;
    font-size:14px;
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:220px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    line-height:1.6;
    resize:vertical;
}

input[type="text"]{
    width:100%;
    padding:12px 14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-top:8px;
}

textarea:focus,
input[type="text"]:focus{
    outline:none;
    border-color:#4285f4;
}

.keyword-label{
    display:block;
    margin-top:18px;
    font-size:14px;
    font-weight:bold;
}

.keyword-hint{
    margin-top:5px;
    font-size:12px;
    color:#888;
}

.count{
    margin-top:10px;
    font-size:14px;
    color:#666;
}

.search-list{
    margin-top:20px;
}

.search-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.keyword{
    flex:1;
    font-size:15px;
    word-break:break-word;
}

/* 検索ボタン */
.search-button{
    flex-shrink:0;
    padding:9px 16px;
    border:0;
    border-radius:8px;
    background:#4285f4;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:background .2s;
}

/* 検索済み */
.search-button.searched{
    background:#34a853;
}

/* 押した瞬間 */
.search-button:active{
    transform:scale(.97);
}

.clear-button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#eee;
    color:#333;
    font-size:14px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

    <h1>🔎 Google検索</h1>

    <div class="description">
        検索したいワードを1行ずつ入力してください。
    </div>

    <textarea
        id="keywords"
        placeholder="沖縄 プール ホテル
北海道 子連れ ホテル
東北 プール ホテル
北陸 プール ホテル"></textarea>

    <label class="keyword-label" for="suffixKeyword">
        各行の後ろに追加するキーワード
    </label>

    <input
        type="text"
        id="suffixKeyword"
        placeholder="例：楽天トラベル"
    >

    <div class="keyword-hint">
        入力すると、各行の末尾に「半角スペース＋キーワード」を追加して検索します。
    </div>

    <div class="count">
        検索ワード：<span id="count">0</span>件
    </div>

    <div id="searchList" class="search-list"></div>

    <button id="clearButton" class="clear-button">
        クリア
    </button>

</div>

<script>

const textarea = document.getElementById("keywords");
const suffixKeyword = document.getElementById("suffixKeyword");
const count = document.getElementById("count");
const searchList = document.getElementById("searchList");
const clearButton = document.getElementById("clearButton");


/* 検索済みワードを保存 */
const searchedKeywords = new Set();


/* 入力されたキーワードを取得 */
function getKeywords(){

    return textarea.value
        .split(/\r?\n/)
        .map(word => word.trim())
        .filter(word => word !== "");

}


/* 実際に検索するキーワード */
function getSearchKeyword(keyword){

    const suffix = suffixKeyword.value.trim();

    if(suffix === ""){
        return keyword;
    }

    return keyword + " " + suffix;

}


/* 検索ボタン一覧を更新 */
function updateSearchList(){

    const keywords = getKeywords();

    count.textContent = keywords.length;

    searchList.innerHTML = "";


    keywords.forEach(keyword => {

        const searchKeyword = getSearchKeyword(keyword);


        /* 行 */
        const item = document.createElement("div");
        item.className = "search-item";


        /* キーワード */
        const text = document.createElement("div");
        text.className = "keyword";
        text.textContent = searchKeyword;


        /* 検索ボタン */
        const button = document.createElement("button");
        button.className = "search-button";
        button.textContent = "検索";


        /* 以前検索済みなら緑にする */
        if(searchedKeywords.has(searchKeyword)){
            button.classList.add("searched");
        }


        /* ボタンを押したとき */
        button.addEventListener("click", () => {

            const url =
                "https://www.google.com/search?q=" +
                encodeURIComponent(searchKeyword);

            window.open(url, "_blank");


            /* 検索済みにする */
            searchedKeywords.add(searchKeyword);


            /* ボタンを緑にする */
            button.classList.add("searched");

        });


        item.appendChild(text);
        item.appendChild(button);

        searchList.appendChild(item);

    });

}


/* テキスト入力時 */
textarea.addEventListener("input", updateSearchList);


/* 追加キーワード入力時 */
suffixKeyword.addEventListener("input", updateSearchList);


/* クリアボタン */
clearButton.addEventListener("click", () => {

    textarea.value = "";
    suffixKeyword.value = "";

    count.textContent = "0";

    searchList.innerHTML = "";

    /* 検索済み状態もリセット */
    searchedKeywords.clear();

    textarea.focus();

});


/* 初期表示 */
updateSearchList();

</script>

</body>
</html>
